[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coach-mcp"
version = "0.1.0"
description = "Owner-authorized read-only MCP adapter for the private AI Coach backend"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0", "httpx>=0.28,<1", "google-auth>=2.58,<3", "requests>=2,<3", "PyJWT[crypto]>=2.14,<3", "uvicorn>=0.31,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
