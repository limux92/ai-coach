[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coach-data"
version = "0.1.0"
description = "Private Garmin/Intervals.icu training archive and planned workouts on Google Cloud"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "google-cloud-firestore>=2.19,<3", "google-cloud-storage>=3,<4", "fitdecode==0.11.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
